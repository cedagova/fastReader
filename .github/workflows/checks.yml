# The repository's hosted gate. Runs the same three loops the agent guide
# defines (docs/agent-first-development.md): isolated tests, the rendered-UI
# golden diff, and static analysis. It also builds what ships: the release
# variant's R8 minification (the step that applies every keep rule, the app's
# and each library's consumer rules), the libraries as a source copy in a
# standalone host, and the compile of every instrumented-test source set. Any
# failure turns the run red, and scripts/release.sh refuses to publish a commit
# this workflow has not passed on.
#
# The golden step is a hard gate: tolerances are never loosened to make this job
# pass. See docs/agent-first-development.md for the platform the goldens are
# recorded on.
#
# No secrets and no signing material: release signing and publication stay
# local in scripts/release.sh.
#
# Actions are pinned to full commit SHAs (the tag each resolved to is in the
# trailing comment), so a moved tag cannot change what runs here.
name: checks

# One run per commit: a pull request's commits run through `pull_request` (for
# every base branch, so leaf PRs into a collector branch are checked too), and
# `push` covers only `main`, whose commits are what scripts/release.sh tags.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same pull request cancels the older, now-superseded
# run. A `main` commit gets a group of its own (its SHA), so it is never
# cancelled or displaced by a later push: each commit keeps its own result,
# because release.sh reads the result of the exact commit it tags.
concurrency:
  group: checks-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: unit tests, goldens, lint, R8, instrumented-test compile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # JDK 21 is the one JDK this project builds and validates on (locally, in
      # scripts/release.sh and here), so CI never runs on a runner-default JDK.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Each check runs even when an earlier one failed, so one run reports
      # every problem instead of only the first. Any failed step fails the job.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Roborazzi golden verification
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon verifyRoborazziDebug

      # checkKotlinAbi compares each Reader library's compiled public surface
      # with its committed api/<module>.api dump (build-logic, #198), so an
      # unintended public change is a red run until the dump is updated.
      - name: Lint, formatting and library API surface
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon lint spotlessCheck checkKotlinAbi

      # The shipped APK's code path: R8 shrinks and optimizes the release
      # variant with the same rules release.sh builds with. The task stops
      # before packaging, so it needs no signing key, and the build's refusal
      # to package an unsigned release (app/build.gradle.kts) stays untouched.
      # A malformed or missing-but-needed rule that makes R8 fail fails here.
      - name: R8 release minification
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:minifyReleaseWithR8

      # The libraries as another repository takes them: a source copy
      # (docs/library-consumption.md). The script copies the listed files and
      # catalog entries into a throwaway standalone project, runs its minified
      # build and the copied contract tests, and fails if a library's own keep
      # rules no longer keep its serialized types under R8.
      - name: Library copy check
        if: ${{ !cancelled() }}
        run: scripts/library-copy-check.sh --no-daemon

      # Instrumented tests run on a device, which this job has not; compiling
      # every module's androidTest sources still catches a source that no
      # longer builds on the change that broke it.
      - name: Instrumented-test compile
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon compileDebugAndroidTestSources

      # Failure reports and the actual/diff PNGs, so a red run can be diagnosed
      # without re-running anything locally.
      - name: Upload reports and golden diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
            app/build/outputs/mapping/release/
            reader-auth/build/reports/
            reader-library/build/reports/
          if-no-files-found: ignore
          retention-days: 14
