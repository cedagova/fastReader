# Toolchain and libraries, last refreshed to current stable 2026-09-09 (#50).
#
# Everything below is the newest stable release of its artifact at that date;
# nothing is held back. Two versions are constrained rather than chosen:
#
#   * material-icons-core is a deprecated artifact frozen at 1.7.8, and the
#     Compose BOM pins it, so it carries no version here (see [libraries]).
#   * junit stays 4.13.2 because that is the last JUnit 4 release.
#
# When something cannot move, pin it here with the reason on the line above it.
#
# SDK levels and the JVM target are declared here too, once, and applied to
# every module by the convention plugins in build-logic/ (#205); compileSdk and
# targetSdk track the same newest-stable policy.

[versions]
compileSdk = "37"
targetSdk = "37"
minSdk = "26"
jvmTarget = "17"
agp = "9.4.0"
kotlin = "2.4.20"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
junit = "4.13.2"
robolectric = "4.16.1"
roborazzi = "1.74.0"
coroutines = "1.11.0"
serialization = "1.11.0"
lifecycle = "2.11.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
uiautomator = "2.4.0"
# supabase-kt 3.8.0 (2026-08-26) is the pinned identity-provider SDK for
# :reader-auth (#93); its behaviours are re-read at this tag in
# reader-auth/CONTRACT.md. ktor is held at the exact Ktor the SDK was built
# against (3.5.1) so the engine and the mock engine share the SDK's client core.
supabase = "3.8.0"
ktor = "3.5.1"
# The formatter and style check (#205): ktlint, run through Spotless.
spotless = "8.10.2"
ktlint = "1.8.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons come from the deprecated material-icons-core artifact, which the Compose
# BOM still pins (1.7.8 in BOM 2026.09.00). Compose Material3 1.4.0 dropped its
# transitive dependency on it, so the app now declares it directly; the icon set
# and the artifact version are unchanged from the previous BOM.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
# Compile-only inputs of the build-logic convention plugins (#205), at the same
# versions the plugins below put on the build classpath.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradlePlugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
