// Compose stability configuration for :app (#228).
//
// :reader-engine is a plain Kotlin/JVM library with no Compose compiler, so
// Compose infers every engine type as unstable and the reader's UI state that
// carries them could not skip recomposition on equal inputs. The types below
// are immutable after construction (only `val`s of immutable values, read-only
// collections the engine never mutates, or private state fixed at build time),
// so declaring them stable here is a true promise. Stateful engine classes
// (the pipeline, inspector, byte sources, timing engine) are deliberately NOT
// listed. Add a type only after checking it has no mutable state.

com.cedagova.reader.engine.content.BookContent
com.cedagova.reader.engine.content.BookIdentity
com.cedagova.reader.engine.content.Chapter
com.cedagova.reader.engine.content.ContentGap
com.cedagova.reader.engine.content.FrontMatter
com.cedagova.reader.engine.content.SkipMarkerToken
com.cedagova.reader.engine.content.Token
com.cedagova.reader.engine.content.TokenPosition
com.cedagova.reader.engine.content.WordToken
com.cedagova.reader.engine.timing.RemainingTimeIndex
com.cedagova.reader.engine.timing.TimingSettings
com.cedagova.reader.engine.timing.TimingState
