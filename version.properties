# fastReader release version — the single source of truth for both the build
# and scripts/release.sh. See docs/release.md.
#
# versionCode  Android's internal integer. MUST strictly increase for every
#              published release; Android refuses an in-place update whose
#              versionCode is not higher (INSTALL_FAILED_VERSION_DOWNGRADE).
# versionName  The human label shown to people, and the release tag without
#              its leading "v" (versionName 1.0.0 -> tag v1.0.0).
versionCode=1
versionName=1.0.0
